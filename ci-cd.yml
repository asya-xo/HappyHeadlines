name: Build and Push Docker Images

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push CommentService
        uses: docker/build-push-action@v5
        with:
          context: ./CommentService
          push: true
          tags: ghcr.io/${{ github.repository }}/commentservice:latest

      - name: Build and Push DraftService
        uses: docker/build-push-action@v5
        with:
          context: ./DraftService
          push: true
          tags: ghcr.io/${{ github.repository }}/draftservice:latest

      - name: Build and Push ArticleService
        uses: docker/build-push-action@v5
        with:
          context: ./ArticleService
          push: true
          tags: ghcr.io/${{ github.repository }}/articleservice:latest
          