networks:
  hhnet:

x-article-env: &article_env
  DB_CONN_GLOBAL: Host=global-db;Username=hh;Password=hh;Database=articles
  DB_CONN_EU:     Host=eu-db;Username=hh;Password=hh;Database=articles
  DB_CONN_NA:     Host=na-db;Username=hh;Password=hh;Database=articles
  DB_CONN_SA:     Host=sa-db;Username=hh;Password=hh;Database=articles
  DB_CONN_AF:     Host=af-db;Username=hh;Password=hh;Database=articles
  DB_CONN_AS:     Host=as-db;Username=hh;Password=hh;Database=articles
  DB_CONN_OC:     Host=oc-db;Username=hh;Password=hh;Database=articles
  DB_CONN_AN:     Host=an-db;Username=hh;Password=hh;Database=articles

services:
  
  # Comment service + database
  
  comment-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: "hh"
      POSTGRES_PASSWORD: "hh"
      POSTGRES_DB: "comments"
    networks: [hhnet]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hh -d comments"]
      interval: 5s
      retries: 5

  comment-service:
    build:
      context: ./CommentService
    environment:
      DB_CONN: Host=comment-db;Username=hh;Password=hh;Database=comments
      PROFANITY_URL: http://profanity-service:8080/api/Profanity/
    ports:
      - "5001:8080"
    depends_on:
      comment-db:
        condition: service_healthy
      profanity-service:
        condition: service_started
    networks: [hhnet]

  
  # Profanity service + database
  
  profanity-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: "hh"
      POSTGRES_PASSWORD: "hh"
      POSTGRES_DB: "profanity"
    networks: [hhnet]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hh -d profanity"]
      interval: 5s
      retries: 5

  profanity-service:
    build:
      context: ./ProfanityService
    environment:
      DB_CONN: Host=profanity-db;Username=hh;Password=hh;Database=profanity
    ports:
      - "5002:8080"
    depends_on:
      profanity-db:
        condition: service_healthy
    networks: [hhnet]

  
  # Draft service + database
  
  draft-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: "hh"
      POSTGRES_PASSWORD: "hh"
      POSTGRES_DB: "drafts"
    networks: [hhnet]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hh -d drafts"]
      interval: 5s
      retries: 5

  draft-service:
    build:
      context: ./DraftService   
    environment:
      DB_CONN: Host=draft-db;Username=hh;Password=hh;Database=drafts
    ports:
      - "5003:8080"
    depends_on:
      draft-db:
        condition: service_healthy
    networks: [hhnet]

  
  # Article services (x3)
  
  article-service-1:
    build:
      context: ./ArticleService
    environment:
      <<: *article_env
      INSTANCE_NAME: "article-service-1"
    depends_on:
      - global-db
      - eu-db
      - na-db
      - sa-db
      - af-db
      - as-db
      - oc-db
      - an-db
    networks: [hhnet]

  article-service-2:
    build:
      context: ./ArticleService
    environment:
      <<: *article_env
      INSTANCE_NAME: "article-service-2"
    depends_on:
      - global-db
      - eu-db
      - na-db
      - sa-db
      - af-db
      - as-db
      - oc-db
      - an-db
    networks: [hhnet]

  article-service-3:
    build:
      context: ./ArticleService
    environment:
      <<: *article_env
      INSTANCE_NAME: "article-service-3"
    depends_on:
      - global-db
      - eu-db
      - na-db
      - sa-db
      - af-db
      - as-db
      - oc-db
      - an-db
    networks: [hhnet]

  
  # Load balancer (nginx)
  
  lb:
    image: nginx:alpine
    container_name: article-lb
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - article-service-1
      - article-service-2
      - article-service-3
    networks: [hhnet]

  
  # Postgres databases for articles
  
  global-db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: "hh", POSTGRES_PASSWORD: "hh", POSTGRES_DB: "articles" }
    networks: [hhnet]

  eu-db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: "hh", POSTGRES_PASSWORD: "hh", POSTGRES_DB: "articles" }
    networks: [hhnet]

  na-db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: "hh", POSTGRES_PASSWORD: "hh", POSTGRES_DB: "articles" }
    networks: [hhnet]

  sa-db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: "hh", POSTGRES_PASSWORD: "hh", POSTGRES_DB: "articles" }
    networks: [hhnet]

  af-db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: "hh", POSTGRES_PASSWORD: "hh", POSTGRES_DB: "articles" }
    networks: [hhnet]

  as-db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: "hh", POSTGRES_PASSWORD: "hh", POSTGRES_DB: "articles" }
    networks: [hhnet]

  oc-db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: "hh", POSTGRES_PASSWORD: "hh", POSTGRES_DB: "articles" }
    networks: [hhnet]

  an-db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: "hh", POSTGRES_PASSWORD: "hh", POSTGRES_DB: "articles" }
    networks: [hhnet]
