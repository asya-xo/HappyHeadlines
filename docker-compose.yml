version: "3.9"

networks:
  hhnet:

x-article-env: &article_env
  DB_CONN_GLOBAL: Host=global-db;Username=hh;Password=hh;Database=articles
  DB_CONN_EU:     Host=eu-db;Username=hh;Password=hh;Database=articles
  DB_CONN_NA:     Host=na-db;Username=hh;Password=hh;Database=articles
  DB_CONN_SA:     Host=sa-db;Username=hh;Password=hh;Database=articles
  DB_CONN_AF:     Host=af-db;Username=hh;Password=hh;Database=articles
  DB_CONN_AS:     Host=as-db;Username=hh;Password=hh;Database=articles
  DB_CONN_OC:     Host=oc-db;Username=hh;Password=hh;Database=articles
  DB_CONN_AN:     Host=an-db;Username=hh;Password=hh;Database=articles

services:
  # Comment service + DB
  comment-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: "hh"
      POSTGRES_PASSWORD: "hh"
      POSTGRES_DB: "comments"
    networks: [hhnet]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hh -d comments"]
      interval: 5s
      retries: 5
    volumes:
      - comment-data:/var/lib/postgresql/data

  comment-service:
    build:
      context: ./CommentService
    environment:
      DB_CONN: Host=comment-db;Username=hh;Password=hh;Database=comments
      PROFANITY_URL: http://profanity-service:8080/api/Profanity/
    ports:
      - "5001:8080"
    depends_on:
      comment-db:
        condition: service_healthy
      profanity-service:
        condition: service_started
    networks: [hhnet]

  # Profanity service + DB
  profanity-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: "hh"
      POSTGRES_PASSWORD: "hh"
      POSTGRES_DB: "profanity"
    networks: [hhnet]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hh -d profanity"]
      interval: 5s
      retries: 5
    volumes:
      - profanity-data:/var/lib/postgresql/data

  profanity-service:
    build:
      context: ./ProfanityService
    environment:
      DB_CONN: Host=profanity-db;Username=hh;Password=hh;Database=profanity
    ports:
      - "5002:8080"
    depends_on:
      profanity-db:
        condition: service_healthy
    networks: [hhnet]

  # Draft service + DB
  draft-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: "hh"
      POSTGRES_PASSWORD: "hh"
      POSTGRES_DB: "drafts"
    networks: [hhnet]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hh -d drafts"]
      interval: 5s
      retries: 5
    volumes:
      - draft-data:/var/lib/postgresql/data

  draft-service:
    build:
      context: ./DraftService
    environment:
      DB_CONN: Host=draft-db;Username=hh;Password=hh;Database=drafts
    ports:
      - "5003:8080"
    depends_on:
      draft-db:
        condition: service_healthy
    networks: [hhnet]

  # Article service instances (3x)
  article-service-1:
    build:
      context: ./ArticleService
    environment:
      <<: *article_env
      INSTANCE_NAME: "article-service-1"
    networks: [hhnet]

  article-service-2:
    build:
      context: ./ArticleService
    environment:
      <<: *article_env
      INSTANCE_NAME: "article-service-2"
    networks: [hhnet]

  article-service-3:
    build:
      context: ./ArticleService
    environment:
      <<: *article_env
      INSTANCE_NAME: "article-service-3"
    networks: [hhnet]

  # Load balancer (nginx)
  lb:
    image: nginx:alpine
    container_name: article-lb
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - article-service-1
      - article-service-2
      - article-service-3
    networks: [hhnet]

  # Article DBs (per continent + global)
  global-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: "hh"
      POSTGRES_PASSWORD: "hh"
      POSTGRES_DB: "articles"
    networks: [hhnet]
    volumes:
      - article-global-data:/var/lib/postgresql/data

  eu-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: "hh"
      POSTGRES_PASSWORD: "hh"
      POSTGRES_DB: "articles"
    networks: [hhnet]
    volumes:
      - article-eu-data:/var/lib/postgresql/data

  na-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: "hh"
      POSTGRES_PASSWORD: "hh"
      POSTGRES_DB: "articles"
    networks: [hhnet]
    volumes:
      - article-na-data:/var/lib/postgresql/data

  sa-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: "hh"
      POSTGRES_PASSWORD: "hh"
      POSTGRES_DB: "articles"
    networks: [hhnet]
    volumes:
      - article-sa-data:/var/lib/postgresql/data

  af-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: "hh"
      POSTGRES_PASSWORD: "hh"
      POSTGRES_DB: "articles"
    networks: [hhnet]
    volumes:
      - article-af-data:/var/lib/postgresql/data

  as-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: "hh"
      POSTGRES_PASSWORD: "hh"
      POSTGRES_DB: "articles"
    networks: [hhnet]
    volumes:
      - article-as-data:/var/lib/postgresql/data

  oc-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: "hh"
      POSTGRES_PASSWORD: "hh"
      POSTGRES_DB: "articles"
    networks: [hhnet]
    volumes:
      - article-oc-data:/var/lib/postgresql/data

  an-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: "hh"
      POSTGRES_PASSWORD: "hh"
      POSTGRES_DB: "articles"
    networks: [hhnet]
    volumes:
      - article-an-data:/var/lib/postgresql/data
  seq:
    image: datalust/seq
    ports:
      - "5343:5341"
      - "8099:80"
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_NOAUTHENTICATION=true
    volumes:
      - seq_data:/data
    networks:
      - hhnet


volumes:
  draft-data:
  comment-data:
  profanity-data:
  article-global-data:
  article-eu-data:
  article-na-data:
  article-sa-data:
  article-af-data:
  article-as-data:
  article-oc-data:
  article-an-data:
  seq_data:
