name: Build and Push Docker Images

on:
  push:
    branches:
      - master

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ArticleService
        run: |
          IMAGE_NAME=ghcr.io/${{ github.repository_owner }}/articleservice
          VERSION=$(date +%Y%m%d%H%M)
          docker build -t $IMAGE_NAME:$VERSION -t $IMAGE_NAME:latest ./ArticleService
          docker push $IMAGE_NAME:$VERSION
          docker push $IMAGE_NAME:latest

      - name: Build and push CommentService
        run: |
          IMAGE_NAME=ghcr.io/${{ github.repository_owner }}/commentservice
          VERSION=$(date +%Y%m%d%H%M)
          docker build -t $IMAGE_NAME:$VERSION -t $IMAGE_NAME:latest ./CommentService
          docker push $IMAGE_NAME:$VERSION
          docker push $IMAGE_NAME:latest

      - name: Build and push DraftService
        run: |
          IMAGE_NAME=ghcr.io/${{ github.repository_owner }}/draftservice
          VERSION=$(date +%Y%m%d%H%M)
          docker build -t $IMAGE_NAME:$VERSION -t $IMAGE_NAME:latest ./DraftService
          docker push $IMAGE_NAME:$VERSION
          docker push $IMAGE_NAME:latest

      - name: Build and push ProfanityService
        run: |
          IMAGE_NAME=ghcr.io/${{ github.repository_owner }}/profanityservice
          VERSION=$(date +%Y%m%d%H%M)
          docker build -t $IMAGE_NAME:$VERSION -t $IMAGE_NAME:latest ./ProfanityService
          docker push $IMAGE_NAME:$VERSION
          docker push $IMAGE_NAME:latest
